<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0a1f2c">

    <title>TPCS | Admin Portal</title>

    <link rel="icon" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        /* ==========================================================
           DESIGN TOKENS (same family as index.html / verify.html)
        ========================================================== */
        :root {
            --ink: #0a1f2c;
            --ink-2: #123446;
            --teal: #0e7c86;
            --sea: #7fd1c7;
            --amber: #f5b544;
            --gold-light: #ffe3a1;
            --gold-dark: #d9962a;
            --text: #dbe9ec;
            --muted: #9fb8c0;

            --font-display: 'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

            --gold-gradient: linear-gradient(135deg, var(--gold-light), var(--amber) 55%, var(--gold-dark));
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--ink);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--amber);
            outline-offset: 3px;
        }

        /* ==========================================================
           NAVBAR (same as index.html + home icon)
        ========================================================== */
        .navbar {
            position: fixed;
            top: 12px;
            left: 0;
            right: 0;
            z-index: 9999;
            width: 92%;
            max-width: 1150px;
            margin: 0 auto;
            padding: 10px 14px 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(10, 31, 44, .72);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .28);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo img {
            width: 48px;
            height: 48px;
            padding: 6px;
            object-fit: contain;
            border-radius: 50%;
            background: linear-gradient(145deg, #1b3a4d, #0d2431);
            border: 1px solid rgba(255, 255, 255, .12);
        }

        .logo h1 {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -.03em;
            color: #fff;
            white-space: nowrap;
        }

        .logo span {
            color: var(--amber);
        }

        .nav-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .nav-home {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(245, 181, 68, .12);
            border: 1px solid rgba(245, 181, 68, .45);
            color: var(--amber);
            font-size: 16px;
            text-decoration: none;
            transition: background .25s, color .25s, transform .25s;
        }

        .nav-home:hover {
            background: var(--amber);
            color: var(--ink);
            transform: translateY(-2px);
        }

        .version {
            padding: 9px 18px;
            border-radius: 999px;
            background: rgba(127, 209, 199, .1);
            border: 1px solid rgba(127, 209, 199, .35);
            color: #e6f6f3;
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
        }

        /* ==========================================================
           PAGE
        ========================================================== */
        .tpcs-login-section {
            min-height: 100vh;
            padding: 120px 24px 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 12% 8%, rgba(14, 124, 134, .35) 0%, transparent 38%),
                radial-gradient(circle at 92% 95%, rgba(245, 181, 68, .16) 0%, transparent 36%),
                linear-gradient(160deg, #0a1f2c, #07151f);
        }

        /* ripple rings: same motif as the home page hero */
        .tpcs-login-section::before {
            content: "";
            position: absolute;
            width: 760px;
            height: 760px;
            right: -260px;
            top: -280px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0 38px, rgba(127, 209, 199, .09) 38px 39px);
            pointer-events: none;
        }

        .tpcs-login-section::after {
            content: "";
            position: absolute;
            width: 560px;
            height: 560px;
            left: -240px;
            bottom: -260px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0 38px, rgba(245, 181, 68, .07) 38px 39px);
            pointer-events: none;
        }

        /* ==========================================================
           WRAPPER
        ========================================================== */
        .tpcs-login-wrapper {
            width: 100%;
            max-width: 1120px;
            display: grid;
            grid-template-columns: 46% 54%;
            position: relative;
            z-index: 5;
            overflow: hidden;
            border-radius: 30px;
            border: 1px solid transparent;
            background:
                linear-gradient(180deg, rgba(14, 38, 52, .92), rgba(8, 24, 34, .95)) padding-box,
                linear-gradient(150deg, rgba(245, 181, 68, .7), rgba(255, 255, 255, .08) 38%, rgba(127, 209, 199, .3)) border-box;
            box-shadow: 0 50px 100px -30px rgba(0, 0, 0, .65), 0 0 0 1px rgba(0, 0, 0, .2);
            animation: loginFade .7s ease;
        }

        /* gold hairline across the top edge */
        .tpcs-login-wrapper::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 18%;
            right: 18%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
            z-index: 3;
        }

        /* ==========================================================
           LEFT PANEL
        ========================================================== */
        .tpcs-login-side {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 64px 52px;
            background: linear-gradient(160deg, #17415a 0%, #0f2c3d 55%, #0a1f2c 100%);
            border-right: 1px solid rgba(255, 255, 255, .08);
        }

        .tpcs-login-side::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            right: -190px;
            top: -170px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0 30px, rgba(245, 181, 68, .13) 30px 31px);
        }

        .tpcs-login-side::after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            left: -150px;
            bottom: -150px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0 30px, rgba(127, 209, 199, .12) 30px 31px);
        }

        .tpcs-login-side-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .tpcs-login-side h1 {
            font-family: var(--font-display);
            font-size: clamp(32px, 3.6vw, 44px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.03em;
            color: #fff;
            margin-bottom: 26px;
        }

        .tpcs-login-side h1::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            border-radius: 3px;
            background: var(--gold-gradient);
            margin-top: 26px;
        }

        .tpcs-login-features {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 34px;
        }

        .tpcs-feature {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            padding: 18px 20px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 18px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tpcs-feature i {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            background: rgba(245, 181, 68, .1);
            border: 1px solid rgba(245, 181, 68, .45);
            font-size: 18px;
            color: var(--amber);
        }

        .tpcs-feature h4 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.01em;
            color: #fff;
            margin-bottom: 3px;
        }

        .tpcs-feature span {
            font-size: 14.5px;
            line-height: 1.7;
            color: var(--muted);
        }

        /* ==========================================================
           RIGHT PANEL (form)
        ========================================================== */
        .tpcs-login-form-side {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 56px;
        }

        .tpcs-login-card {
            width: 100%;
            max-width: 420px;
        }

        .tpcs-login-emblem {
            width: 66px;
            height: 66px;
            margin: 0 auto 32px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(245, 181, 68, .1);
            border: 1px solid rgba(245, 181, 68, .5);
            box-shadow: 0 0 0 9px rgba(245, 181, 68, .06);
            color: var(--amber);
            font-size: 24px;
        }

        .tpcs_color_login_group {
            margin-bottom: 24px;
        }

        .tpcs_color_login_group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .01em;
            color: #e6f2f4;
        }

        .tpcs_color_login_input {
            position: relative;
        }

        .tpcs_color_login_input input {
            width: 100%;
            height: 58px;
            padding: 0 55px 0 18px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 14px;
            background: rgba(255, 255, 255, .05);
            font-family: var(--font-body);
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: border-color .3s, background .3s, box-shadow .3s;
        }

        .tpcs_color_login_input input::placeholder {
            color: #6f8b95;
        }

        .tpcs_color_login_input input:focus {
            background: rgba(255, 255, 255, .08);
            border-color: var(--amber);
            box-shadow: 0 0 0 4px rgba(245, 181, 68, .16);
        }

        .tpcs_color_login_input input:-webkit-autofill {
            -webkit-text-fill-color: #fff;
            -webkit-box-shadow: 0 0 0 100px #12303f inset;
            caret-color: #fff;
        }

        .tpcs_color_login_input i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #7fa0aa;
            cursor: pointer;
            transition: color .3s;
        }

        .tpcs_color_login_input input:focus+i {
            color: var(--amber);
        }

        .tpcs_color_login_input i:hover {
            color: var(--amber);
        }

        .tpcs-login-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 14px;
            margin-top: 10px;
            background: var(--gold-gradient);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .02em;
            cursor: pointer;
            transition: transform .3s, box-shadow .3s, opacity .3s;
            box-shadow: 0 16px 36px -10px rgba(245, 181, 68, .55);
        }

        /* light sweep on hover */
        .tpcs-login-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -80%;
            width: 50%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-20deg);
            transition: left .7s;
        }

        .tpcs-login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 22px 44px -10px rgba(245, 181, 68, .7);
        }

        .tpcs-login-btn:hover::after {
            left: 130%;
        }

        .tpcs-login-btn:active {
            transform: scale(.98);
        }

        .tpcs-login-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        #tpcs_login_message {
            min-height: 22px;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #fca5a5;
        }

        .tpcs-login-footer {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, .1);
            text-align: center;
        }

        .tpcs-login-footer p {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .tpcs-login-footer small {
            display: block;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--muted);
        }

        /* ==========================================================
           ANIMATION
        ========================================================== */
        @keyframes loginFade {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================================
           RESPONSIVE
        ========================================================== */
        @media(max-width:1050px) {

            .tpcs-login-wrapper {
                grid-template-columns: 1fr;
                max-width: 600px;
            }

            .tpcs-login-side {
                padding: 48px 36px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, .08);
            }

            .tpcs-login-form-side {
                padding: 46px 32px;
            }
        }

        @media(max-width:768px) {

            .navbar {
                top: 8px;
                border-radius: 26px;
            }

            .logo img {
                width: 42px;
                height: 42px;
            }

            .logo h1 {
                font-size: 22px;
            }

            .nav-home {
                width: 38px;
                height: 38px;
            }

            .version {
                font-size: 11.5px;
                padding: 8px 12px;
                border-radius: 16px;
            }

            .tpcs-login-section {
                padding: 104px 16px 40px;
            }

            .tpcs-login-wrapper {
                border-radius: 24px;
            }

            .tpcs-login-side {
                padding: 38px 26px;
            }

            .tpcs-feature {
                padding: 15px;
                gap: 15px;
            }

            .tpcs-feature i {
                width: 44px;
                height: 44px;
                font-size: 16px;
            }

            .tpcs-feature h4 {
                font-size: 16px;
            }

            .tpcs-feature span {
                font-size: 13.5px;
            }

            .tpcs-login-form-side {
                padding: 36px 22px;
            }
        }

        @media(max-width:480px) {

            .navbar {
                width: 94%;
                padding: 8px 10px;
                gap: 8px;
            }

            .logo {
                gap: 8px;
            }

            .logo img {
                width: 38px;
                height: 38px;
                padding: 5px;
            }

            .logo h1 {
                font-size: 19px;
            }

            .nav-right {
                gap: 6px;
            }

            .nav-home {
                width: 34px;
                height: 34px;
                font-size: 14px;
            }

            .version {
                font-size: 10px;
                padding: 6px 10px;
                max-width: 130px;
            }

            .tpcs-login-section {
                padding: 92px 14px 32px;
            }

            .tpcs-login-emblem {
                width: 58px;
                height: 58px;
                font-size: 21px;
                margin-bottom: 26px;
            }

            .tpcs_color_login_input input,
            .tpcs-login-btn {
                height: 56px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            .tpcs-login-wrapper {
                animation: none;
            }

            .tpcs-login-btn,
            .tpcs-login-btn::after,
            .nav-home {
                transition: none;
            }
        }
    </style>

</head>

<body>

    <!-- ===================== NAVBAR ===================== -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="TPCS Logo">
            <h1>TP<span>CS</span></h1>
        </a>
        <div class="nav-right">
            <a href="index.html" class="nav-home" aria-label="Back to home" title="Home">
                <i class="fa-solid fa-house"></i>
            </a>
            
    </header>


    <section class="tpcs-login-section">

        <div class="tpcs-login-wrapper">

            <!-- LEFT PANEL -->

            <div class="tpcs-login-side">

                <div class="tpcs-login-side-content">

                    <h1>
                        Digital Administration Portal
                    </h1>

                    <div class="tpcs-login-features">

                        <div class="tpcs-feature">

                            <i class="fa-solid fa-shield-halved"></i>

                            <div>

                                <h4>Secure Access</h4>

                                <span>Protected authentication for administrators.</span>

                            </div>

                        </div>

                        <div class="tpcs-feature">

                            <i class="fa-solid fa-folder-open"></i>

                            <div>

                                <h4>Digital Records</h4>

                                <span>Efficient management of payment confirmations.</span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- RIGHT PANEL -->

            <div class="tpcs-login-form-side">

                <div class="tpcs-login-card">

                    <div class="tpcs-login-emblem" aria-hidden="true">
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <div class="tpcs_color_login_group">

                        <label for="tpcs_admin_email">Email Address</label>

                        <div class="tpcs_color_login_input">

                            <input type="email" id="tpcs_admin_email" placeholder="Enter your email address">

                            <i class="fa-regular fa-envelope"></i>

                        </div>

                    </div>

                    <div class="tpcs_color_login_group">

                        <label for="tpcs_admin_password">Password</label>

                        <div class="tpcs_color_login_input">

                            <input id="tpcs_admin_password" type="password" placeholder="Enter your password">

                            <i id="tpcs_password_eye" class="fa-regular fa-eye">
                            </i>

                        </div>

                    </div>

                    <button id="tpcs_login_button" type="button" class="tpcs-login-btn">

                        Sign In Securely

                    </button>

                    <p id="tpcs_login_message"></p>

                    <div class="tpcs-login-footer">

                        <p>

                            Tourism Payment Confirmation System

                        </p>

                        <small>

                            Academic Digital Platform • Version 1.0

                        </small>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script>

        let passwordBox = document.getElementById("tpcs_admin_password");

        let eyeIcon = document.getElementById("tpcs_password_eye");

        eyeIcon.onclick = function () {

            if (passwordBox.type === "password") {

                passwordBox.type = "text";

                eyeIcon.classList.remove("fa-eye");

                eyeIcon.classList.add("fa-eye-slash");

            }

            else {

                passwordBox.type = "password";

                eyeIcon.classList.remove("fa-eye-slash");

                eyeIcon.classList.add("fa-eye");

            }

        }

    </script>

    <script>

        const tpcsLoginForm = document.querySelector(".tpcs_color_login_content");

        const tpcsLoginButton = document.querySelector(".tpcs_color_login_btn");

        const tpcsLoginMessage = document.getElementById("tpcs_login_message");

        tpcsLoginButton.addEventListener("click", function (e) {

            e.preventDefault();

            let email = document.querySelector('input[type="email"]').value;

            let password = document.getElementById("tpcs_admin_password").value;

            if (email === "" || password === "") {

                tpcsLoginMessage.innerHTML = "Please enter email and password";

                return;

            }

            tpcsLoginButton.innerHTML = "Signing in...";

            tpcsLoginButton.style.opacity = "0.7";

            setTimeout(function () {

                tpcsLoginButton.innerHTML = "Sign In";

                tpcsLoginButton.style.opacity = "1";

                tpcsLoginMessage.innerHTML = "Login system ready";

            }, 1500);

        });

    </script>

    <script type="module">

        // Import Firebase App
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

        // Import Firebase Authentication
        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        // Your Firebase configuration

        const firebaseConfig = {

            apiKey: "AIzaSyC_IYj5k6TQhOgR2_dayL9BROef6M81KIk",

            authDomain: "tpcs-e6b64.firebaseapp.com",

            projectId: "tpcs-e6b64",

            storageBucket: "tpcs-e6b64.firebasestorage.app",

            messagingSenderId: "650125374204",

            appId: "1:650125374204:web:7a9060c31be9d72dfe5d79"

        };

        // Initialize Firebase

        const app = initializeApp(firebaseConfig);

        // Initialize Authentication

        const auth = getAuth(app);

        // TPCS LOGIN FUNCTION

        const tpcsLoginButton = document.getElementById("tpcs_login_button");

        const tpcsLoginMessage = document.getElementById("tpcs_login_message");

        tpcsLoginButton.addEventListener("click", async function () {

            const email = document.querySelector('input[type="email"]').value;

            const password = document.getElementById("tpcs_admin_password").value;

            if (email === "" || password === "") {

                tpcsLoginMessage.innerHTML = "Please enter email and password";

                return;

            }

            tpcsLoginButton.innerHTML = "Signing in...";

            tpcsLoginButton.disabled = true;

            try {

                const userCredential = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                tpcsLoginMessage.style.color = "#86efac";

                tpcsLoginMessage.innerHTML = "Login successful";

                console.log("Admin logged in:", userCredential.user.email);

                setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);

                // Later we redirect to dashboard here

            }

            catch (error) {

                tpcsLoginMessage.style.color = "#fca5a5";

                if (error.code === "auth/invalid-credential") {

                    tpcsLoginMessage.innerHTML = "Invalid email or password";

                }

                else {
                    tpcsLoginMessage.innerHTML = error.message;

                }
            }

            finally {

                tpcsLoginButton.innerHTML = "Sign In";
                tpcsLoginButton.disabled = false;
            }
        });
    </script>
</body>

</html>
